name: Deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://hsjni0110.github.io
      BASE_PATH: /
    steps:
      - uses: actions/checkout@v7
      - name: Check, build and upload site
        uses: withastro/action@v6
        with:
          node-version: 24
          build-cmd: npm run check && npm run build && node scripts/check-output.mjs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
